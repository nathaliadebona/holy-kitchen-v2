    <header>
        <nav aria-label="Navegação principal">

            <a href="login.html" aria-label="Login" id="usuario"><i class="fa-solid fa-user"></i></a>
        </nav>
    </header>

    <main>
        <section id="login">
            <div id="login-img">

            </div>

            <div id="login-form">
                <h2>Login</h2>
                <p>Bem-vindo(a) de volta! Entre com seus dados pra acessar sua conta.</p>
            
                <form action="" autocomplete="on">
                    <label for="email">E-mail</label>
                    <input type="email" name="email" id="email" required placeholder="Seu e-mail">

                    <label for="senha">Senha</label>
                    <input type="password" name="senha" id="senha" required placeholder="Sua senha">

                    <input class="botao botao-principal" type="submit" name="entrar" id="entrar" value="Entrar">

                    <div class="botoes-form">
                        <button class="botao botao-secundario" type="button">Cadastrar</button>
                        <button class="botao botao-secundario" type="button">Esqueceu a senha?</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
